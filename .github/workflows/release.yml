name: Release build

# Manual only: Actions tab > "Release build" > Run workflow.
# Builds BooxSync.app and a dmg on a macOS runner, then publishes it as
#   - an OCI artifact in the GitHub package registry (ghcr.io/<owner>/<repo>:<version>), and
#   - a GitHub Release asset (optional).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0 (no leading v)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release (the package is then not tagged latest)"
        required: false
        default: false
        type: boolean
      publish_package:
        description: "Publish the dmg to the GitHub package registry (ghcr.io)"
        required: false
        default: true
        type: boolean
      create_release:
        description: "Also create a GitHub Release with the dmg attached"
        required: false
        default: true
        type: boolean

permissions:
  contents: write    # create the release and tag
  packages: write    # push to ghcr.io

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      VERSION: ${{ inputs.version }}
      # Optional signing identity. Without these secrets the app is ad-hoc signed.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_CERT_NAME: ${{ secrets.MACOS_CERT_NAME }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$VERSION' must look like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Stop if this version already exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Pick a new version."
            exit 1
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          swift --version
          sw_vers

      - name: Install adb (bundled into the app)
        run: |
          brew install --cask android-platform-tools
          adb version

      - name: Import signing certificate (optional)
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "BOOXSYNC_SIGN_IDENTITY=${MACOS_CERT_NAME:-BooxSync Local Signing}" >> "$GITHUB_ENV"

      - name: Checks
        run: swift run CoreChecks

      - name: Build the app and dmg
        env:
          BOOXSYNC_VERSION: ${{ inputs.version }}
          BOOXSYNC_BUILD: ${{ github.run_number }}
        run: scripts/make-dmg.sh

      - name: Verify the app
        run: |
          codesign --verify --deep --strict dist/BooxSync.app
          codesign -dv dist/BooxSync.app 2>&1 | grep -E "Identifier|Signature|Authority" || true
          test -x dist/BooxSync.app/Contents/Resources/adb
          test -f dist/BooxSync.app/Contents/Resources/AppIcon.icns
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/BooxSync.app/Contents/Info.plist
          ls -lh dist/*.dmg

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 "BooxSync-$VERSION.dmg" | tee "BooxSync-$VERSION.dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: BooxSync-${{ inputs.version }}
          path: |
            dist/BooxSync-${{ inputs.version }}.dmg
            dist/BooxSync-${{ inputs.version }}.dmg.sha256
          if-no-files-found: error

      - name: Set up ORAS
        if: inputs.publish_package
        uses: oras-project/setup-oras@v1

      - name: Publish to the GitHub package registry (ghcr.io)
        if: inputs.publish_package
        working-directory: dist
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          REPO="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GH_ACTOR" --password-stdin
          oras push "$REPO:$VERSION" \
            --artifact-type application/vnd.booxsync.release.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=BooxSync $VERSION for macOS (dmg)" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            "BooxSync-$VERSION.dmg:application/x-apple-diskimage" \
            "BooxSync-$VERSION.dmg.sha256:text/plain"
          if [ "$PRERELEASE" != "true" ]; then oras tag "$REPO:$VERSION" latest; fi
          {
            echo "### Published to the GitHub package registry"
            echo
            echo '```bash'
            echo "oras pull $REPO:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=(--title "BooxSync $VERSION" --generate-notes --target "$GITHUB_SHA")
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "v$VERSION" "${FLAGS[@]}" \
            "dist/BooxSync-$VERSION.dmg" "dist/BooxSync-$VERSION.dmg.sha256"
