name: Release build

# Manual only: Actions tab > "Release build" > Run workflow.
#
# 1. "plan" reads the commit messages since the last tag (Conventional Commits), works out the next semantic
#    version and the changelog entry. Run it with dry_run to only see the plan.
# 2. "release" updates VERSION and CHANGELOG.md, tags the commit, builds the dmg on a macOS runner, pushes the
#    commit and tag, then publishes the dmg to
#      - the GitHub package registry as an OCI artifact (ghcr.io/<owner>/<repo>:<version>), and
#      - a GitHub Release (optional) whose notes are the new changelog section.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump: auto reads the commit messages (feat = minor, fix = patch, breaking = major)"
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      version:
        description: "Optional exact version (for example 1.0.0). Overrides the bump."
        required: false
        default: ""
        type: string
      dry_run:
        description: "Only show the planned version and changelog, build and publish nothing"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release (the package is then not tagged latest)"
        required: false
        default: false
        type: boolean
      publish_package:
        description: "Publish the dmg to the GitHub package registry (ghcr.io)"
        required: false
        default: true
        type: boolean
      create_release:
        description: "Also create a GitHub Release with the dmg attached"
        required: false
        default: true
        type: boolean

permissions:
  contents: write    # push the release commit and tag, create the release
  packages: write    # push to ghcr.io

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Releases are made from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on the main branch (it is on ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history and all tags, needed to find commits since the last release

      - name: Release script tests
        run: python3 scripts/test_release.py

      - name: Plan the release
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          python3 scripts/release.py plan --bump "$BUMP" ${VERSION_OVERRIDE:+--version "$VERSION_OVERRIDE"} \
            --github-output "$GITHUB_OUTPUT" --notes-out "$RUNNER_TEMP/notes.md" | tee "$RUNNER_TEMP/plan.txt"
          {
            echo "## Release plan"
            echo
            echo '```'
            head -n 3 "$RUNNER_TEMP/plan.txt"
            echo '```'
            echo
            echo "### Changelog entry"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Make sure the version is new
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. Choose a different version."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Choose a different version."
            exit 1
          fi

  release:
    needs: plan
    if: ${{ !inputs.dry_run }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      # Optional signing identity. Without these secrets the app is ad-hoc signed.
      MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      MACOS_CERT_NAME: ${{ secrets.MACOS_CERT_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update VERSION and CHANGELOG.md, commit and tag
        env:
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py plan --bump "$BUMP" ${VERSION_OVERRIDE:+--version "$VERSION_OVERRIDE"} \
            --write --github-output "$GITHUB_OUTPUT" --notes-out "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/plan.txt"
          head -n 3 "$RUNNER_TEMP/plan.txt"
          PLANNED="$(tr -d '[:space:]' < VERSION)"
          if [ "$PLANNED" != "$VERSION" ]; then
            echo "::error::The plan changed between jobs ($VERSION vs $PLANNED). Run the workflow again."
            exit 1
          fi
          git add VERSION CHANGELOG.md
          # The first release already has its VERSION and CHANGELOG entry, so there may be nothing to commit.
          if ! git diff --cached --quiet; then git commit -m "chore(release): v$VERSION"; fi
          git tag -a "v$VERSION" -m "BooxSync $VERSION"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          swift --version
          sw_vers

      - name: Install adb (bundled into the app)
        run: |
          brew install --cask android-platform-tools
          adb version

      - name: Import signing certificate (optional)
        if: env.MACOS_CERT_P12_BASE64 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "BOOXSYNC_SIGN_IDENTITY=${MACOS_CERT_NAME:-BooxSync Local Signing}" >> "$GITHUB_ENV"

      - name: Checks
        run: swift run CoreChecks

      - name: Build the app and dmg
        env:
          BOOXSYNC_VERSION: ${{ needs.plan.outputs.version }}
          BOOXSYNC_BUILD: ${{ github.run_number }}
        run: scripts/make-dmg.sh

      - name: Verify the app
        run: |
          codesign --verify --deep --strict dist/BooxSync.app
          codesign -dv dist/BooxSync.app 2>&1 | grep -E "Identifier|Signature|Authority" || true
          test -x dist/BooxSync.app/Contents/Resources/adb
          test -f dist/BooxSync.app/Contents/Resources/AppIcon.icns
          BUILT="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/BooxSync.app/Contents/Info.plist)"
          echo "App version: $BUILT"
          test "$BUILT" = "$VERSION"
          ls -lh dist/*.dmg

      - name: Checksum
        working-directory: dist
        run: shasum -a 256 "BooxSync-$VERSION.dmg" | tee "BooxSync-$VERSION.dmg.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: BooxSync-${{ needs.plan.outputs.version }}
          path: |
            dist/BooxSync-${{ needs.plan.outputs.version }}.dmg
            dist/BooxSync-${{ needs.plan.outputs.version }}.dmg.sha256
          if-no-files-found: error

      # Push only after the build succeeded, so a failed build leaves no release commit or tag behind.
      - name: Push the release commit and tag
        run: git push origin "HEAD:refs/heads/main" "refs/tags/v$VERSION"

      - name: Set up ORAS
        if: inputs.publish_package
        uses: oras-project/setup-oras@v1

      - name: Publish to the GitHub package registry (ghcr.io)
        if: inputs.publish_package
        working-directory: dist
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          REPO="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr 'A-Z' 'a-z')"
          echo "$GH_TOKEN" | oras login ghcr.io -u "$GH_ACTOR" --password-stdin
          oras push "$REPO:$VERSION" \
            --artifact-type application/vnd.booxsync.release.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.description=BooxSync $VERSION for macOS (dmg)" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.licenses=MIT" \
            "BooxSync-$VERSION.dmg:application/x-apple-diskimage" \
            "BooxSync-$VERSION.dmg.sha256:text/plain"
          if [ "$PRERELEASE" != "true" ]; then oras tag "$REPO:$VERSION" latest; fi
          {
            echo "### Published to the GitHub package registry"
            echo
            echo '```bash'
            echo "oras pull $REPO:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub Release
        if: inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=(--title "BooxSync $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "v$VERSION" "${FLAGS[@]}" \
            "dist/BooxSync-$VERSION.dmg" "dist/BooxSync-$VERSION.dmg.sha256"
